name: daily-broadcast
on:
  workflow_dispatch: {}            # 手动测试
  schedule:
    - cron: '30 1 * * 1-5'         # 09:30 CST(UTC+8)工作日;GitHub cron 为 UTC,实际可能延迟几分钟

permissions:
  contents: read

concurrency:
  group: broadcast

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build payload & send Lark broadcast
        working-directory: ci
        env:
          DASH_PW: ${{ secrets.DASH_PW }}
          LARK_HOOK: ${{ secrets.LARK_HOOK }}
        run: |
          node dataenc.mjs decrypt-all
          python ci_build_payload.py
          python broadcast.py
